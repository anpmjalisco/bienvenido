    <script>
        // Fecha y hora
        function updateDateTime() {
            const date = new Date();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            document.getElementById('fecha-y-hora').innerHTML = `Fecha: ${day}/${month}/${year} - Hora: ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Nav toggle
        const navToggle = document.querySelector('.nav-toggle');
        const links = document.querySelector('.links');
        navToggle.addEventListener('click', () => {
            links.classList.toggle('show-links');
        });

        // Contador regresivo
        function updateCountdown() {
        const eventDate = new Date('August 29, 2026 00:00:00').getTime();
  
        // Creamos la fecha actual y la reseteamos a las 00:00:00
        const now = new Date();
        now.setHours(0, 0, 0, 0); 
  
        const distance = eventDate - now.getTime();
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  
        document.getElementById("days").textContent = days;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();


        // Funciones legacy (por compatibilidad)
        function openModal(src) {

            document.getElementById('modal').style.display = "block";

        function closeModalLegacy() {
            document.getElementById('modal').style.display = "none";
